name: Specs
on: push

jobs:
  specs-and-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # plain text for the step summary
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      # yarn 1 fetches every platform's native binaries into its cache, node_modules keeps only ours;
      # install still runs on a hit, yarn sees the lockfile is satisfied and exits at once
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck 🦜
        run: yarn tsc

      - name: Lint 🕵
        run: yarn lint

      - name: Specs 🧪
        run: |
          set -o pipefail
          yarn -s coverage | tee coverage.log

      - name: Reports
        run: |
          { echo '```'; sed -n '/Coverage report/,$p' coverage.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "badge_total=$(jq '[.total | del(.branchesTrue) | .[].pct] | add / length * 100 | round / 100' coverage/coverage-summary.json)" >> "$GITHUB_ENV"

      - name: Update badge
        if: github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 5f76f3b771603857432300417fcb90e0
          filename: badge.json
          namedLogo: vitest
          logoColor: white
          logoWidth: 12
          label: coverage
          message: ${{env.badge_total}}%
          valColorRange: ${{env.badge_total}}
          minColorRange: 0
          maxColorRange: 100
